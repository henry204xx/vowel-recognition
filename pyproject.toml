[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesian-vowel-recognition"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "python_speech_features", "pandas", "matplotlib", "pyyaml"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
